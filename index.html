<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROMO Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg:#080B0F; --surface:#0E1318; --surface2:#141B22; --surface3:#1A2330;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.1);
  --text:#E2EAF0; --muted:#5A6A78; --muted2:#8A9BAA;
  --green:#00E5A0; --green-dim:rgba(0,229,160,0.12);
  --red:#FF3D5A; --red-dim:rgba(255,61,90,0.12);
  --blue:#4D9FFF; --blue-dim:rgba(77,159,255,0.12);
  --amber:#FFB020; --amber-dim:rgba(255,176,32,0.12);
  --purple:#A78BFA; --purple-dim:rgba(167,139,250,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:18px;}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(77,159,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;max-width:1600px;margin:0 auto;padding:2.5rem;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
.logo{display:flex;align-items:center;gap:16px;}
.logo-mark{width:52px;height:52px;background:linear-gradient(135deg,#4D9FFF,#00E5A0);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#080B0F;}
.logo h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.02em;}
.logo h1 span{color:var(--blue);}
.logo p{font-size:0.75rem;color:var(--muted);margin-top:3px;}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.status-chip{display:flex;align-items:center;gap:7px;padding:8px 16px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;font-size:0.78rem;color:var(--muted2);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite;}
.dot.error{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

/* Nav */
.nav{display:flex;gap:4px;margin-bottom:2rem;background:var(--surface2);border-radius:12px;padding:4px;width:fit-content;flex-wrap:wrap;}
.nav-tab{padding:10px 20px;border-radius:9px;font-size:0.85rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted2);transition:all 0.15s;font-family:Arial,sans-serif;}
.nav-tab.active{background:var(--blue);color:#080B0F;}

/* Upload section */
.upload-bar{display:flex;align-items:center;gap:10px;padding:1rem 1.4rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:1.5rem;flex-wrap:wrap;}
.upload-bar-title{font-size:0.78rem;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-right:8px;}
.upload-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:0.78rem;cursor:pointer;font-family:Arial,sans-serif;transition:all 0.15s;}
.upload-btn:hover{border-color:var(--blue);color:var(--blue);}
.upload-btn.uploading{opacity:0.6;cursor:wait;}
.upload-btn.done{border-color:var(--green);color:var(--green);}
.upload-btn input{display:none;}
.ppt-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#E63946,#C1121F);color:#fff;font-size:0.78rem;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;margin-left:auto;}
.ppt-btn:hover{opacity:0.85;}
.ppt-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* Controls */
.controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
.tab{padding:8px 20px;border-radius:7px;font-size:0.85rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted2);transition:all 0.15s;font-family:Arial,sans-serif;}
.tab.active{background:var(--blue);color:#080B0F;}
.filter-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.date-input{font-size:0.8rem;padding:8px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:Arial,sans-serif;}
.date-sep{color:var(--muted);font-size:0.8rem;}
.date-reset{font-size:0.78rem;padding:8px 12px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-family:Arial,sans-serif;}
.date-reset:hover{background:var(--surface2);}
.sel{font-size:0.8rem;padding:8px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:Arial,sans-serif;min-width:140px;}

/* Currency sections */
.currency-section{margin-bottom:1.5rem;}
.currency-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding:10px 16px;border-radius:10px;}
.currency-header.myr{background:rgba(77,159,255,0.08);border:1px solid rgba(77,159,255,0.2);}
.currency-header.sgd{background:rgba(0,229,160,0.08);border:1px solid rgba(0,229,160,0.2);}
.currency-label{font-size:1rem;font-weight:700;}
.currency-label.myr{color:var(--blue);}
.currency-label.sgd{color:var(--green);}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;position:relative;overflow:hidden;}
.metric::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.metric.myr-card::after{background:var(--blue);}
.metric.sgd-card::after{background:var(--green);}
.metric .lbl{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.metric .val{font-size:1.8rem;font-weight:700;letter-spacing:-0.02em;line-height:1;}
.metric .val.myr-val{color:var(--blue);}
.metric .val.sgd-val{color:var(--green);}
.metric .sub{font-size:0.7rem;color:var(--muted);margin-top:6px;}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;}
.chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.chart-title{font-size:0.75rem;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;}
.legend{display:flex;gap:14px;flex-wrap:wrap;}
.legend span{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--muted2);}
.leg{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.chart-wrap{position:relative;width:100%;height:240px;}
.divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}

/* Table */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.table-hd{padding:1.1rem 1.4rem;border-bottom:1px solid var(--border);font-size:0.75rem;color:var(--muted2);text-transform:uppercase;letter-spacing:0.08em;}
.table-wrap{overflow-x:auto;max-height:500px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;}
th{font-size:0.72rem;color:var(--muted);font-weight:400;text-align:right;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;position:sticky;top:0;background:var(--surface);}
th:first-child,th:nth-child(2),th:nth-child(3){text-align:left;}
td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:right;font-size:0.82rem;white-space:nowrap;color:var(--muted2);}
td:first-child{text-align:left;color:var(--muted);font-size:0.75rem;}
td:nth-child(2),td:nth-child(3){text-align:left;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.type-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.7rem;background:var(--blue-dim);color:var(--blue);}
.myr-v{color:var(--blue);}
.sgd-v{color:var(--green);}

/* Analysis page */
.analysis-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:1.5rem;}
.analysis-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.analysis-card-header{padding:12px 16px;font-size:0.85rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.analysis-card-header.green{background:var(--green-dim);color:var(--green);}
.analysis-card-header.red{background:var(--red-dim);color:var(--red);}
.analysis-card-header.amber{background:var(--amber-dim);color:var(--amber);}
.analysis-item{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.analysis-item:last-child{border-bottom:none;}
.analysis-item-name{font-size:0.82rem;color:var(--text);flex:1;}
.analysis-item-profit{font-size:0.82rem;font-weight:700;white-space:nowrap;}
.analysis-item-stats{font-size:0.72rem;color:var(--muted);text-align:right;}
.cur-toggle{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;margin-bottom:1.5rem;width:fit-content;}
.cur-tab{padding:7px 20px;border-radius:7px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--muted2);transition:all 0.15s;font-family:Arial,sans-serif;}
.cur-tab.active{background:var(--blue);color:#080B0F;}
.analysis-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem;}

/* Player page */
.player-search{display:flex;gap:10px;margin-bottom:1.5rem;}
.player-input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:0.9rem;font-family:Arial,sans-serif;}
.player-input:focus{outline:none;border-color:var(--blue);}
.search-btn{padding:12px 20px;border-radius:10px;border:none;background:var(--blue);color:#080B0F;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;}
.search-btn:hover{opacity:0.85;}
.player-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin-bottom:14px;}
.player-name{font-size:1.4rem;font-weight:800;margin-bottom:0.5rem;}
.player-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.4rem;}
.player-stat{background:var(--surface2);border-radius:10px;padding:1rem;text-align:center;}
.player-stat .lbl{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.player-stat .val{font-size:1.2rem;font-weight:700;}
.promo-category{background:var(--surface2);border-radius:12px;overflow:hidden;margin-bottom:8px;}
.promo-category-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;transition:background 0.15s;}
.promo-category-header:hover{background:var(--surface3);}
.pch-left{display:flex;align-items:center;gap:12px;}
.pch-name{font-size:0.9rem;font-weight:700;color:var(--text);}
.pch-count{font-size:0.72rem;color:var(--muted);background:var(--surface3);padding:2px 8px;border-radius:10px;}
.pch-right{display:flex;align-items:center;gap:16px;}
.pch-stat{text-align:right;}
.pch-stat .lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;}
.pch-stat .val{font-size:0.82rem;font-weight:700;}
.pch-arrow{color:var(--muted);font-size:0.85rem;transition:transform 0.2s;}
.pch-arrow.open{transform:rotate(180deg);}
.promo-category-table{display:none;border-top:1px solid var(--border);}
.promo-category-table.open{display:block;}
.promo-category-table table{width:100%;border-collapse:collapse;}
.promo-category-table th{font-size:0.7rem;color:var(--muted);font-weight:400;text-align:right;padding:8px 14px;border-bottom:1px solid var(--border);text-transform:uppercase;background:var(--surface);}
.promo-category-table th:first-child{text-align:left;}
.promo-category-table td{padding:9px 14px;border-bottom:1px solid var(--border);text-align:right;font-size:0.82rem;color:var(--muted2);}
.promo-category-table td:first-child{text-align:left;color:var(--muted);}
.promo-category-table tr:last-child td{border-bottom:none;}
.promo-category-table tr:hover td{background:rgba(255,255,255,0.02);}

/* Builder */
.builder-layout{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start;}
.builder-panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;position:sticky;top:1rem;}
.builder-panel h3{font-size:0.85rem;font-weight:700;margin-bottom:1.25rem;}
.field-group{margin-bottom:1.25rem;}
.field-group label{display:block;font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
.field-group select,.field-group input[type=date]{width:100%;font-size:0.82rem;padding:9px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-family:Arial,sans-serif;}
.multi-select{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;}
.multi-select label{display:flex;align-items:center;gap:8px;font-size:0.8rem;color:var(--text);text-transform:none;letter-spacing:0;cursor:pointer;padding:5px 8px;border-radius:6px;}
.multi-select label:hover{background:var(--surface2);}
.multi-select input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px;}
.chart-type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ct-btn{padding:10px 6px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--muted2);cursor:pointer;font-size:0.7rem;font-family:Arial,sans-serif;text-align:center;transition:all 0.15s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.ct-btn:hover,.ct-btn.active{border-color:var(--blue);background:var(--blue-dim);color:var(--blue);font-weight:700;}
.ct-icon{font-size:1.2rem;}
.build-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--blue);color:#080B0F;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;margin-top:0.5rem;}
.builder-output{display:flex;flex-direction:column;gap:14px;}
.built-chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;}
.built-chart-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.built-chart-title{font-size:0.9rem;font-weight:700;}
.remove-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px;}
.remove-btn:hover{color:var(--red);}
.empty-builder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:var(--muted);font-size:0.85rem;gap:1rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;}
.empty-icon{font-size:3rem;opacity:0.3;}

.loading-state{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);font-size:0.85rem;gap:10px;}
.spinner{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="logo">
    <div class="logo-mark">P</div>
    <div>
      <h1>PROMO <span>Dashboard</span></h1>
      <p>MYR & SGD  |  实时数据分析</p>
    </div>
  </div>
  <div class="header-right">
    <button class="ppt-btn" id="pptBtn" onclick="generateReport()" disabled>📊 生成报告</button>
    <div class="status-chip">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">加载中...</span>
    </div>
  </div>
</div>

<!-- Upload Bar -->
<div class="upload-bar">
  <span class="upload-bar-title">上传数据</span>
  <label class="upload-btn" id="btnMYR">
    <input type="file" accept=".csv" onchange="uploadCSV('MYR',this)" />
    📂 MYR CSV
  </label>
  <label class="upload-btn" id="btnSGD">
    <input type="file" accept=".csv" onchange="uploadCSV('SGD',this)" />
    📂 SGD CSV
  </label>
  <label class="upload-btn" id="btnAP">
    <input type="file" accept=".xlsx,.xls" onchange="uploadActivePlayer(this)" />
    📅 Active Player
  </label>
</div>

<!-- Nav -->
<div class="nav">
  <button class="nav-tab active" onclick="switchPage('overview',this)">📊 总览</button>
  <button class="nav-tab" onclick="switchPage('analysis',this)">🔍 Promo 分析</button>
  <button class="nav-tab" onclick="switchPage('player',this)">👤 玩家行为</button>
  <button class="nav-tab" onclick="switchPage('builder',this)">🎨 图表构建器</button>
</div>

<!-- ── OVERVIEW PAGE ── -->
<div id="overviewPage">
  <div class="controls">
    <div class="tabs">
      <button class="tab active" onclick="setView('day',this)">日</button>
      <button class="tab" onclick="setView('week',this)">周</button>
      <button class="tab" onclick="setView('month',this)">月</button>
    </div>
    <div class="filter-wrap">
      <input type="date" class="date-input" id="dateFrom" onchange="loadData()" />
      <span class="date-sep">至</span>
      <input type="date" class="date-input" id="dateTo" onchange="loadData()" />
      <button class="date-reset" onclick="resetDates()">重置</button>
      <select class="sel" id="promoFilter" onchange="renderOverview()"><option value="all">全部 Promo</option></select>
    </div>
  </div>

  <div id="overviewContent">
    <div class="loading-state"><div class="spinner"></div>等待数据...</div>
  </div>
</div>

<!-- ── ANALYSIS PAGE ── -->
<div id="analysisPage" class="hidden">
  <div class="cur-toggle">
    <button class="cur-tab active" onclick="setAnalysisCur('MYR',this)">🇲🇾 MYR</button>
    <button class="cur-tab" onclick="setAnalysisCur('SGD',this)">🇸🇬 SGD</button>
    <button class="cur-tab" onclick="setAnalysisCur('ALL',this)">全部</button>
  </div>
  <div class="analysis-summary" id="analysisSummary"></div>
  <div style="margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.25rem;">
    <div style="font-size:0.75rem;color:var(--muted2);text-transform:uppercase;margin-bottom:0.75rem;">判断标准</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:0.82rem;">
      <span style="color:var(--green)">✅ 继续 — 净利润 &gt; 0</span>
      <span style="color:var(--amber)">⚠️ 检讨 — 净利润 &lt; 0 但有存款</span>
      <span style="color:var(--red)">🛑 停止 — 净利润 &lt; 0 且无存款</span>
    </div>
  </div>
  <div class="analysis-grid" id="analysisGrid"></div>
  <div class="chart-card">
    <div class="chart-hd"><div class="chart-title">净利润排名</div></div>
    <div style="position:relative;width:100%;height:350px;"><canvas id="analysisChart"></canvas></div>
  </div>
</div>

<!-- ── PLAYER PAGE ── -->
<div id="playerPage" class="hidden">
  <div class="player-search">
    <input type="text" class="player-input" id="playerInput" placeholder="输入玩家账号（Login），按 Enter 搜索" onkeydown="if(event.key==='Enter')searchPlayer()" />
    <button class="search-btn" onclick="searchPlayer()">🔍 搜索</button>
  </div>
  <div id="playerContent">
    <div style="text-align:center;padding:3rem;color:var(--muted);font-size:0.85rem;">输入玩家账号来查看他的领取记录和行为分析</div>
  </div>
</div>

<!-- ── BUILDER PAGE ── -->
<div id="builderPage" class="hidden">
  <div class="builder-layout">
    <div class="builder-panel">
      <h3>🎨 图表构建器</h3>
      <div class="field-group">
        <label>货币</label>
        <select id="bCurrency"><option value="MYR">🇲🇾 MYR</option><option value="SGD">🇸🇬 SGD</option><option value="ALL">全部</option></select>
      </div>
      <div class="field-group">
        <label>X 轴 / 分组</label>
        <select id="bXAxis">
          <option value="date_day">按日期（日）</option>
          <option value="date_week">按日期（周）</option>
          <option value="date_month">按日期（月）</option>
          <option value="promo">按 Promo 名称</option>
        </select>
      </div>
      <div class="field-group">
        <label>Y 轴（可多选）</label>
        <div class="multi-select" id="bYAxis">

<script>
const API = 'https://promo-api.annann5653.workers.dev';
const METRIC_LABELS = { claims:'领取人次', deposit_ppl:'存款人数', deposit:'存款金额', bonus:'派发 Bonus', netProfit:'净利润', roi:'ROI %' };
const COLORS = ['#4D9FFF','#00E5A0','#FFB020','#A78BFA','#FF3D5A','#00C9FF','#FFE45E','#FF6B6B'];

let allData = [], activeData = {}, view = 'day', ovCharts = {}, builtCharts = [], chartCounter = 0;
let analysisCur = 'MYR', analysisChartInst = null, selectedChartType = 'bar';

// ── Init ──
async function init() {
  try {
    const dates = await apiFetch('/dates');
    if (dates.myr?.from || dates.sgd?.from) {
      const from = dates.myr?.from || dates.sgd?.from;
      const to   = dates.myr?.to   || dates.sgd?.to;
      document.getElementById('dateFrom').value = from;
      document.getElementById('dateTo').value   = to;
      setStatus('live', '已连接');
      document.getElementById('pptBtn').disabled = false;
      await loadData();
    } else {
      setStatus('live', '暂无数据，请上传 CSV');
    }
  } catch(e) {
    setStatus('error', '连接失败');
    console.error(e);
  }
}

async function apiFetch(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error('API error: ' + res.status);
  return res.json();
}

function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (type === 'live' ? ' live' : type === 'error' ? ' error' : '');
  document.getElementById('statusText').textContent = text;
}

// ── Upload CSV ──
async function uploadCSV(currency, input) {
  const file = input.files[0]; if (!file) return;
  const btn = document.getElementById('btn' + currency);
  btn.className = 'upload-btn uploading';
  btn.querySelector('input').previousSibling && null;
  setStatus('', '上传中...');

  try {
    const text = await file.text();
    const res = await fetch(API + '/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ csv: text, currency })
    });
    const data = await res.json();
    if (data.success) {
      btn.className = 'upload-btn done';
      btn.innerHTML = `<input type="file" accept=".csv" onchange="uploadCSV('${currency}',this)" /> ✅ ${currency} (${data.inserted})`;
      setStatus('live', '上传成功');
      await loadData();
    } else {
      throw new Error(data.error);
    }
  } catch(e) {
    btn.className = 'upload-btn';
    setStatus('error', '上传失败: ' + e.message);
    alert('上传失败: ' + e.message);
  }
}

// ── Upload Active Players ──
async function uploadActivePlayer(input) {
  const file = input.files[0]; if (!file) return;
  const btn = document.getElementById('btnAP');
  btn.className = 'upload-btn uploading';

  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

    let hRow = -1;
    for (let i = 0; i < raw.length; i++) {
      if (raw[i] && raw[i].some(c => String(c).includes('日期') || String(c).toLowerCase().includes('date'))) { hRow = i; break; }
    }
    if (hRow < 0) throw new Error('找不到表头');

    const records = [];
    for (let i = hRow + 1; i < raw.length; i++) {
      const r = raw[i]; if (!r || !r[0]) continue;
      let dateStr = '';
      const dateVal = r[0];
      if (typeof dateVal === 'number' && dateVal > 40000) {
        const d = new Date((dateVal - 25569) * 86400 * 1000);
        dateStr = d.toISOString().slice(0, 10);
      } else {
        dateStr = String(dateVal).slice(0, 10);
      }
      if (!dateStr) continue;
      records.push({ date: dateStr, myr_count: parseInt(r[1]) || 0, sgd_count: parseInt(r[2]) || 0 });
    }

    const res = await fetch(API + '/upload-active', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records })
    });
    const data = await res.json();
    if (data.success) {
      btn.className = 'upload-btn done';
      btn.innerHTML = `<input type="file" accept=".xlsx,.xls" onchange="uploadActivePlayer(this)" /> ✅ Active (${data.inserted}天)`;
      await loadData();
    } else throw new Error(data.error);
  } catch(e) {
    btn.className = 'upload-btn';
    alert('上传失败: ' + e.message);
  }
}

// ── Load Data ──
async function loadData() {
  const from = document.getElementById('dateFrom').value;
  const to   = document.getElementById('dateTo').value;

  setStatus('', '加载中...');
  try {
    let q = '/records?limit=50000';
    if (from) q += '&from=' + from;
    if (to)   q += '&to='   + to;
    allData = await apiFetch(q);

    // Active players
    let aq = '/active?';
    if (from) aq += 'from=' + from + '&';
    if (to)   aq += 'to='   + to;
    const apRows = await apiFetch(aq);
    activeData = {};
    apRows.forEach(r => { activeData[r.date] = { myr: r.myr_count, sgd: r.sgd_count }; });

    // Populate filters
    const promos = [...new Set(allData.map(r => r.code).filter(Boolean))].sort();
    document.getElementById('promoFilter').innerHTML = '<option value="all">全部 Promo</option>' + promos.map(p => `<option value="${p}">${p}</option>`).join('');
    document.getElementById('bPromoList').innerHTML = promos.map(p => `<label><input type="checkbox" value="${p}" checked /> ${p}</label>`).join('');

    setStatus('live', `已同步 · ${allData.length.toLocaleString()} 条记录`);
    document.getElementById('pptBtn').disabled = false;
    renderOverview();
    if (!document.getElementById('analysisPage').classList.contains('hidden')) renderAnalysis();
  } catch(e) {
    setStatus('error', '加载失败');
    console.error(e);
  }
}

function resetDates() {
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  loadData();
}

// ── Page switching ──
function switchPage(page, btn) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['overviewPage','analysisPage','playerPage','builderPage'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', !id.startsWith(page));
  });
  if (page === 'analysis') renderAnalysis();
}

function setView(v, btn) {
  view = v;
  document.querySelectorAll('#overviewPage .tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOverview();
}

// ── Data helpers ──
function getFiltered(currency) {
  const promo = document.getElementById('promoFilter').value;
  return allData.filter(r => {
    if (currency !== 'ALL' && r.currency !== currency) return false;
    if (promo !== 'all' && r.code !== promo) return false;
    return true;
  });
}

function groupByTime(rows, v) {
  v = v || view;
  const map = {};
  rows.forEach(r => {
    let key;
    const d = new Date(r.date);
    if (v === 'day') { key = r.date; }
    else if (v === 'week') {
      const jan1 = new Date(d.getFullYear(), 0, 1);
      const wk = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
      key = `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
    } else { key = r.date.slice(0, 7); }
    if (!map[key]) map[key] = { label: key, claims: 0, depPpl: 0, deposit: 0, bonus: 0, winloss: 0 };
    map[key].claims++;
    map[key].depPpl  += r.transfer > 0 ? 1 : 0;
    map[key].deposit += r.transfer;
    map[key].bonus   += r.bonus;
    map[key].winloss += r.winloss;
  });
  return Object.values(map).sort((a, b) => a.label.localeCompare(b.label));
}

function groupByPromo(rows, currency) {
  const map = {};
  rows.forEach(r => {
    if (!map[r.code]) map[r.code] = { name: r.code, claims: 0, depPpl: 0, deposit: 0, bonus: 0, winloss: 0, dayMap: {} };
    map[r.code].claims++;
    map[r.code].depPpl  += r.transfer > 0 ? 1 : 0;
    map[r.code].deposit += r.transfer;
    map[r.code].bonus   += r.bonus;
    map[r.code].winloss += r.winloss;
    if (!map[r.code].dayMap[r.date]) map[r.code].dayMap[r.date] = 0;
    map[r.code].dayMap[r.date]++;
  });
  const apKey = currency === 'SGD' ? 'sgd' : 'myr';
  return Object.values(map).sort((a, b) => b.claims - a.claims).map(p => {
    p.netProfit = -p.winloss - p.bonus;
    p.roi = p.bonus > 0 ? p.netProfit / p.bonus * 100 : null;
    // Participation rate
    let totalRate = 0, dayCount = 0;
    Object.entries(p.dayMap).forEach(([date, cnt]) => {
      const ap = activeData[date] ? activeData[date][apKey] : 0;
      if (ap > 0) { totalRate += cnt / ap; dayCount++; }
    });
    p.partRate = dayCount > 0 ? totalRate / dayCount : null;
    // Status
    if (p.netProfit > 0) p.status = 'continue';
    else if (p.netProfit < 0 && p.depPpl > 0) p.status = 'review';
    else p.status = 'stop';
    return p;
  });
}

// ── Format ──
function fmtRM(n)  { if (!n && n !== 0) return '—'; const abs = Math.abs(n); const s = 'RM' + abs.toLocaleString('en-MY', {minimumFractionDigits:2,maximumFractionDigits:2}); return n < 0 ? '('+s+')' : s; }
function fmtSGD(n) { if (!n && n !== 0) return '—'; const abs = Math.abs(n); const s = 'S$' + abs.toLocaleString('en-SG', {minimumFractionDigits:2,maximumFractionDigits:2}); return n < 0 ? '('+s+')' : s; }
function fmtAuto(n, cur) { return cur === 'SGD' ? fmtSGD(n) : fmtRM(n); }
function fmtN(n) { return n ? n.toLocaleString('en-MY') : '—'; }
function fmtLabel(label, v) {
  v = v || view;
  const d = new Date(label); if (isNaN(d)) return label;
  if (v === 'day')   return d.toLocaleDateString('en-MY', { day: '2-digit', month: 'short' });
  if (v === 'month') return d.toLocaleDateString('en-MY', { month: 'short', year: 'numeric' });
  return label;
}

// ── Overview ──
function renderOverview() {
  const myrRows = getFiltered('MYR');

  const myrDeposit = myrRows.reduce((s,r) => s + r.transfer, 0);
  const myrBonus   = myrRows.reduce((s,r) => s + r.bonus, 0);
  const myrWL      = myrRows.reduce((s,r) => s + r.winloss, 0);
  const myrNP      = -myrWL - myrBonus;
  const myrPPA     = myrDepPpl > 0 ? myrDeposit / myrDepPpl : 0;
  const myrTotalAP = Object.values(activeData).reduce((s,d) => s + (d.myr||0), 0);
  const myrPart    = myrTotalAP > 0 ? (myrClaims / myrTotalAP * 100).toFixed(1) + '%' : null;

  const sgdClaims  = sgdRows.length;
  const sgdDepPpl  = sgdRows.filter(r => r.transfer > 0).length;
  const sgdDeposit = sgdRows.reduce((s,r) => s + r.transfer, 0);
  const sgdBonus   = sgdRows.reduce((s,r) => s + r.bonus, 0);
  const sgdWL      = sgdRows.reduce((s,r) => s + r.winloss, 0);
  const sgdNP      = -sgdWL - sgdBonus;
  const sgdPPA     = sgdDepPpl > 0 ? sgdDeposit / sgdDepPpl : 0;
  const sgdTotalAP = Object.values(activeData).reduce((s,d) => s + (d.sgd||0), 0);
  const sgdPart    = sgdTotalAP > 0 ? (sgdClaims / sgdTotalAP * 100).toFixed(1) + '%' : null;

  // Table data
  const tableMap = {};
  [...myrRows.map(r=>({...r,cur:'MYR'})), ...sgdRows.map(r=>({...r,cur:'SGD'}))].forEach(r => {
    const key = r.date + '||' + r.code + '||' + r.cur;
    if (!tableMap[key]) tableMap[key] = { date:r.date, code:r.code, cur:r.cur, claims:0, depPpl:0, deposit:0, bonus:0, winloss:0 };
    tableMap[key].claims++;
    tableMap[key].depPpl  += r.transfer > 0 ? 1 : 0;
    tableMap[key].deposit += r.transfer;
    tableMap[key].bonus   += r.bonus;
    tableMap[key].winloss += r.winloss;
  });
  const tableRows = Object.values(tableMap).sort((a,b) => b.date.localeCompare(a.date) || a.code.localeCompare(b.code));

  const myrG = groupByTime(myrRows);
  const sgdG = groupByTime(sgdRows);
  const gc = 'rgba(255,255,255,0.04)';

  document.getElementById('overviewContent').innerHTML = `
    <!-- MYR -->
    <div class="currency-section">
      <div class="currency-header myr"><span class="currency-label myr">🇲🇾 MYR</span></div>
      <div class="metrics">
        <div class="metric myr-card"><div class="lbl">领取人次</div><div class="val myr-val">${fmtN(myrClaims)}</div><div class="sub">${myrPart?'参与率: '+myrPart:myrClaims+' 条记录'}</div></div>
        <div class="metric myr-card"><div class="lbl">存款人数</div><div class="val myr-val">${fmtN(myrDepPpl)}</div><div class="sub">${myrClaims>0?Math.round(myrDepPpl/myrClaims*100)+'% 有存款':'—'}</div></div>
        <div class="metric myr-card"><div class="lbl">总存款</div><div class="val myr-val">${fmtRM(myrDeposit)}</div><div class="sub">人均: ${fmtRM(myrPPA)}</div></div>
        <div class="metric myr-card"><div class="lbl">派发 Bonus</div><div class="val myr-val">${fmtRM(myrBonus)}</div><div class="sub" style="color:${myrNP>=0?'var(--green)':'var(--red)'}">净利润: ${myrNP>=0?'+':''}${fmtRM(myrNP)}</div></div>
      </div>
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-hd"><div class="chart-title">领取人次趋势 (MYR)</div></div><div class="chart-wrap"><canvas id="myrClaimChart"></canvas></div></div>
        <div class="chart-card"><div class="chart-hd"><div class="chart-title">存款 vs Bonus (MYR)</div><div class="legend"><span><span class="leg" style="background:var(--blue)"></span>存款</span><span><span class="leg" style="background:var(--amber)"></span>Bonus</span></div></div><div class="chart-wrap"><canvas id="myrDepBonusChart"></canvas></div></div>
      </div>
    </div>
    <hr class="divider">
    <!-- SGD -->
    <div class="currency-section">
      <div class="currency-header sgd"><span class="currency-label sgd">🇸🇬 SGD</span></div>
      <div class="metrics">
        <div class="metric sgd-card"><div class="lbl">领取人次</div><div class="val sgd-val">${fmtN(sgdClaims)}</div><div class="sub">${sgdPart?'参与率: '+sgdPart:sgdClaims+' 条记录'}</div></div>
        <div class="metric sgd-card"><div class="lbl">存款人数</div><div class="val sgd-val">${fmtN(sgdDepPpl)}</div><div class="sub">${sgdClaims>0?Math.round(sgdDepPpl/sgdClaims*100)+'% 有存款':'—'}</div></div>
        <div class="metric sgd-card"><div class="lbl">总存款</div><div class="val sgd-val">${fmtSGD(sgdDeposit)}</div><div class="sub">人均: ${fmtSGD(sgdPPA)}</div></div>
        <div class="metric sgd-card"><div class="lbl">派发 Bonus</div><div class="val sgd-val">${fmtSGD(sgdBonus)}</div><div class="sub" style="color:${sgdNP>=0?'var(--green)':'var(--red)'}">净利润: ${sgdNP>=0?'+':''}${fmtSGD(sgdNP)}</div></div>

// ── Analysis ──
function setAnalysisCur(cur, btn) {
  analysisCur = cur;
  document.querySelectorAll('.cur-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAnalysis();
}

function renderAnalysis() {
  const rows = analysisCur === 'ALL' ? allData : allData.filter(r => r.currency === analysisCur);
  const currency = analysisCur === 'SGD' ? 'SGD' : 'MYR';
  const fmt = analysisCur === 'SGD' ? fmtSGD : fmtRM;
  const promos = groupByPromo(rows, currency);

  const continueP = promos.filter(p => p.status === 'continue');
  const reviewP   = promos.filter(p => p.status === 'review');
  const stopP     = promos.filter(p => p.status === 'stop');

  const totalClaims = promos.reduce((s,p) => s+p.claims, 0);
  const totalProfit = promos.reduce((s,p) => s+p.netProfit, 0);
  const totalBonus  = promos.reduce((s,p) => s+p.bonus, 0);
  const overallROI  = totalBonus > 0 ? totalProfit/totalBonus*100 : 0;

  document.getElementById('analysisSummary').innerHTML = `
    <div class="metric"><div class="lbl">总 Promo</div><div class="val" style="color:var(--blue)">${promos.length}</div><div class="sub">${fmtN(totalClaims)} 次领取</div></div>
    <div class="metric"><div class="lbl">总净利润</div><div class="val" style="color:${totalProfit>=0?'var(--green)':'var(--red)'}">${totalProfit>=0?'+':''}${fmt(totalProfit)}</div><div class="sub">ROI: ${overallROI>=0?'+':''}${overallROI.toFixed(1)}%</div></div>
    <div class="metric"><div class="lbl">✅ 建议继续</div><div class="val" style="color:var(--green)">${continueP.length}</div><div class="sub">净利润为正</div></div>
    <div class="metric"><div class="lbl">🛑 建议停止</div><div class="val" style="color:var(--red)">${stopP.length}</div><div class="sub">净亏且无存款</div></div>
  `;

  function makeItems(list) {
    return list.map(p => {
      const npC = p.netProfit > 0 ? 'var(--green)' : 'var(--red)';
      const roiStr = p.roi !== null ? (p.roi>=0?'+':'')+p.roi.toFixed(1)+'%' : '—';
      return `<div class="analysis-item">
        <div class="analysis-item-name">${p.name}</div>
        <div style="text-align:right">
          <div class="analysis-item-profit" style="color:${npC}">${p.netProfit>=0?'+':''}${fmt(p.netProfit)}</div>
          <div class="analysis-item-stats">ROI ${roiStr} | 领取 ${p.claims}</div>
        </div>
      </div>`;
    }).join('');
  }

  document.getElementById('analysisGrid').innerHTML = `
    <div class="analysis-card"><div class="analysis-card-header green">✅ 继续跑 (${continueP.length})</div>${continueP.length?makeItems(continueP):'<div style="padding:1rem;color:var(--muted);font-size:0.82rem;text-align:center">暂无</div>'}</div>
    <div class="analysis-card"><div class="analysis-card-header amber">⚠️ 需检讨 (${reviewP.length})</div>${reviewP.length?makeItems(reviewP):'<div style="padding:1rem;color:var(--muted);font-size:0.82rem;text-align:center">暂无</div>'}</div>
    <div class="analysis-card"><div class="analysis-card-header red">🛑 建议停止 (${stopP.length})</div>${stopP.length?makeItems(stopP):'<div style="padding:1rem;color:var(--muted);font-size:0.82rem;text-align:center">暂无</div>'}</div>
  `;

  const top15 = [...promos].slice(0, 15);
  if (analysisChartInst) { analysisChartInst.destroy(); analysisChartInst = null; }
  analysisChartInst = new Chart(document.getElementById('analysisChart'), {
    type: 'bar',
    data: {
      labels: top15.map(p => p.name.length>22?p.name.slice(0,22)+'…':p.name),
      datasets: [{ data: top15.map(p=>p.netProfit), backgroundColor: top15.map(p=>p.netProfit>=0?'rgba(0,229,160,0.8)':'rgba(255,61,90,0.8)'), borderRadius:4 }]
    },
    options: {
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'净利润: '+fmt(ctx.parsed.x)}}},
      scales:{
        x:{ticks:{font:{size:10,family:'Arial'},color:'#5A6A78',callback:v=>fmt(v)},grid:{color:'rgba(255,255,255,0.04)'},border:{color:'transparent'}},
        y:{ticks:{font:{size:10,family:'Arial'},color:'#8A9BAA'},grid:{display:false},border:{color:'transparent'}}
      }
    }
  });
}

function toggleCategory(id) {
  const table = document.getElementById('cat-table-' + id);
  const arrow = document.getElementById('cat-arrow-' + id);
  table.classList.toggle('open');
  arrow.classList.toggle('open');

async function searchPlayer() {
  const login = document.getElementById('playerInput').value.trim();
  if (!login) return;

  document.getElementById('playerContent').innerHTML = '<div class="loading-state"><div class="spinner"></div>搜索中...</div>';

  try {
    const rows = await apiFetch('/player?login=' + encodeURIComponent(login));
    if (!rows.length) {
      document.getElementById('playerContent').innerHTML = '<div style="text-align:center;padding:3rem;color:var(--muted)">找不到玩家「' + login + '」的记录</div>';
      return;
    }

    const totalClaims  = rows.length;
    const totalDeposit = rows.reduce((s,r) => s+r.transfer, 0);
    const totalBonus   = rows.reduce((s,r) => s+r.bonus, 0);
    const totalWL      = rows.reduce((s,r) => s+r.winloss, 0);
    const totalNP      = -totalWL - totalBonus;
    const hasMYR = rows.some(r => r.currency === 'MYR');
    const fmt = hasMYR ? fmtRM : fmtSGD;

    // Group by promo category
    const promoMap = {};
    rows.forEach(r => {
      if (!promoMap[r.code]) promoMap[r.code] = { name: r.code, claims: 0, deposit: 0, bonus: 0, winloss: 0, rows: [] };
      promoMap[r.code].claims++;
      promoMap[r.code].deposit += r.transfer;
      promoMap[r.code].bonus   += r.bonus;
      promoMap[r.code].winloss += r.winloss;
      promoMap[r.code].rows.push(r);
    });

    const promos = Object.values(promoMap).sort((a,b) => b.claims - a.claims).map(p => ({
      ...p,
      netProfit: -p.winloss - p.bonus,
      rows: p.rows.sort((a,b) => b.date.localeCompare(a.date))
    }));

    const categoriesHTML = promos.map((p, i) => {
      const np = p.netProfit;
      const npC = np > 0 ? 'var(--green)' : np < 0 ? 'var(--red)' : 'var(--muted)';
      const roi = p.bonus > 0 ? (np/p.bonus*100).toFixed(1)+'%' : '—';
      const tableRows = p.rows.map(r => {
        const f = r.currency === 'SGD' ? fmtSGD : fmtRM;
        const hasDeposit = r.transfer > 0;
        const rnp = -r.winloss - r.bonus;
        const rnpC = rnp > 0 ? 'var(--green)' : rnp < 0 ? 'var(--red)' : 'var(--muted)';
        return `<tr>
          <td>${r.date}</td>
          <td style="color:${hasDeposit?'var(--green)':'var(--muted)'};">${hasDeposit ? '✅ '+f(r.transfer) : '❌ 无存款'}</td>
          <td style="color:var(--amber);text-align:right">${f(r.bonus)}</td>
          <td style="color:var(--muted2);text-align:right">${f(r.winloss)}</td>
          <td style="color:${rnpC};font-weight:bold;text-align:right">${rnp>=0?'+':''}${f(rnp)}</td>
        </tr>`;
      }).join('');

      return `<div class="promo-category">
        <div class="promo-category-header" onclick="toggleCategory(${i})">
          <div class="pch-left">
            <div class="pch-name">${p.name}</div>
            <div class="pch-count">${p.claims} 次</div>
          </div>
          <div class="pch-right">
            <div class="pch-stat">
              <div class="lbl">总存款</div>
              <div class="val" style="color:var(--green)">${fmt(p.deposit)}</div>
            </div>
            <div class="pch-stat">
              <div class="lbl">Bonus</div>
              <div class="val" style="color:var(--amber)">${fmt(p.bonus)}</div>
            </div>
            <div class="pch-stat">
              <div class="lbl">净利润</div>
              <div class="val" style="color:${npC}">${np>=0?'+':''}${fmt(np)}</div>
            </div>
            <div class="pch-stat">
              <div class="lbl">ROI</div>
              <div class="val" style="color:${npC}">${roi}</div>
            </div>
            <div class="pch-arrow" id="cat-arrow-${i}">▼</div>
          </div>
        </div>
        <div class="promo-category-table" id="cat-table-${i}">
          <table>
            <thead><tr>
              <th>日期</th>
              <th>存款</th>
              <th>Bonus</th>
              <th>Win/Loss</th>
              <th>净利润</th>
            </tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');

    document.getElementById('playerContent').innerHTML = `
      <div class="player-card">
        <div class="player-name">👤 ${login}</div>
        <div class="player-stats">
          <div class="player-stat"><div class="lbl">总领取次数</div><div class="val" style="color:var(--blue)">${fmtN(totalClaims)}</div></div>
          <div class="player-stat"><div class="lbl">总存款</div><div class="val" style="color:var(--green)">${fmt(totalDeposit)}</div></div>
          <div class="player-stat"><div class="lbl">总 Bonus</div><div class="val" style="color:var(--amber)">${fmt(totalBonus)}</div></div>
          <div class="player-stat"><div class="lbl">Win/Loss</div><div class="val" style="color:var(--muted2)">${fmt(totalWL)}</div></div>
          <div class="player-stat"><div class="lbl">净利润</div><div class="val" style="color:${totalNP>=0?'var(--green)':'var(--red)'}">${totalNP>=0?'+':''}${fmt(totalNP)}</div></div>
        </div>
        <div style="font-size:0.75rem;color:var(--muted2);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.75rem;">按 Promo 分类 — 点击展开明细</div>
        ${categoriesHTML}
      </div>
    `;
  } catch(e) {
    document.getElementById('playerContent').innerHTML = '<div style="text-align:center;padding:3rem;color:var(--red)">搜索失败: ' + e.message + '</div>';
  }
}

// ── Chart Builder ──
function selectChartType(btn) {
  document.querySelectorAll('.ct-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedChartType = btn.dataset.type;
}

function buildChart() {
  const currency = document.getElementById('bCurrency').value;
  const xAxis    = document.getElementById('bXAxis').value;
  const metrics  = [...document.querySelectorAll('#bYAxis input:checked')].map(i => i.value);
  const selPromos = [...document.querySelectorAll('#bPromoList input:checked')].map(i => i.value);
  if (!metrics.length) { alert('请至少选一个 Y 轴'); return; }

  let rows = currency === 'ALL' ? allData : allData.filter(r => r.currency === currency);
  rows = rows.filter(r => selPromos.includes(r.code));

  const dview = xAxis === 'date_day' ? 'day' : xAxis === 'date_week' ? 'week' : xAxis === 'date_month' ? 'month' : null;
  let grouped;
  if (dview) {
    grouped = groupByTime(rows, dview).map(r => ({ ...r, label: r.label, netProfit: -r.winloss - r.bonus, roi: r.bonus > 0 ? (-r.winloss-r.bonus)/r.bonus*100 : 0 }));
  } else {
    grouped = groupByPromo(rows, currency === 'SGD' ? 'SGD' : 'MYR');
    grouped.forEach(r => r.label = r.name);
  }

  const labels = grouped.map(r => (dview ? fmtLabel(r.label, dview) : r.label).slice(0, 20));
  const fmt = currency === 'SGD' ? fmtSGD : fmtRM;

  const getVal = (r, m) => {
    if (m === 'claims') return r.claims;
    if (m === 'deposit_ppl') return r.depPpl;
    if (m === 'deposit') return r.deposit;
    if (m === 'bonus') return r.bonus;
    if (m === 'netProfit') return r.netProfit;
    if (m === 'roi') return r.roi || 0;
    return 0;
  };

  const isPie = selectedChartType === 'pie' || selectedChartType === 'doughnut';
  const isH   = selectedChartType === 'bar_h';
  const isArea = selectedChartType === 'area';
  const chartType = isPie ? selectedChartType : isH ? 'bar' : isArea ? 'line' : 'bar';

  const datasets = isPie && metrics.length === 1
    ? [{ data: grouped.map(r => getVal(r, metrics[0])), backgroundColor: grouped.map((_,i) => COLORS[i%COLORS.length]), borderWidth: 0 }]
    : metrics.map((m, i) => ({
        label: METRIC_LABELS[m],
        data: grouped.map(r => getVal(r, m)),
        backgroundColor: COLORS[i%COLORS.length] + 'BB',
        borderColor: COLORS[i%COLORS.length],
        borderWidth: isArea ? 2 : 0,
        borderRadius: !isArea && !isH ? 4 : 0,
        fill: isArea, tension: isArea ? 0.35 : 0, pointRadius: isArea ? 3 : 0,
      }));

  const isMoneyM = metrics.some(m => ['deposit','bonus','netProfit'].includes(m));
  const opts = {
    responsive: true, maintainAspectRatio: false,
    indexAxis: isH ? 'y' : 'x',
    plugins: { legend: { display: datasets.length > 1, labels:{color:'#8A9BAA',font:{size:11,family:'Arial'}} }, tooltip: { callbacks: { label: ctx => { const v = ctx.parsed[isH?'x':'y']??ctx.parsed; const m = metrics[ctx.datasetIndex]||metrics[0]; return (ctx.dataset.label||METRIC_LABELS[m])+': '+((['deposit','bonus','netProfit'].includes(m))?fmt(v):fmtN(v)); }}}},
  };
  if (!isPie) {
    opts.scales = {
      x: { ticks:{font:{size:10,family:'Arial'},color:'#5A6A78',autoSkip:true,maxRotation:45}, grid:{display:false}, border:{color:'transparent'} },
      y: { ticks:{font:{size:10,family:'Arial'},color:'#5A6A78',callback:v=>isMoneyM?fmt(v):fmtN(v)}, grid:{color:'rgba(255,255,255,0.04)'}, border:{color:'transparent'} }
    };
    if (isH) { opts.scales.x.ticks.callback = v=>isMoneyM?fmt(v):fmtN(v); delete opts.scales.y.ticks.callback; }
  }

  const title = `${currency} · ${metrics.map(m=>METRIC_LABELS[m]).join(' & ')} · ${xAxis.replace('date_','按').replace('promo','按Promo')}`;
  const id = 'chart_' + chartCounter++;
  const output = document.getElementById('builderOutput');
  const empty = output.querySelector('.empty-builder');
  if (empty) empty.remove();

  const card = document.createElement('div');
  card.className = 'built-chart-card'; card.id = 'card_' + id;
  card.innerHTML = `<div class="built-chart-hd"><div class="built-chart-title">${title}</div><button class="remove-btn" onclick="removeChart('${id}')">×</button></div><div style="position:relative;width:100%;height:320px;"><canvas id="${id}"></canvas></div>`;
  output.insertBefore(card, output.firstChild);

  const c = new Chart(document.getElementById(id), { type: chartType, data: { labels, datasets }, options: opts });
  builtCharts.push({ id, chart: c });
}

function removeChart(id) {
  const idx = builtCharts.findIndex(c => c.id === id);
  if (idx >= 0) { builtCharts[idx].chart.destroy(); builtCharts.splice(idx, 1); }
  const card = document.getElementById('card_' + id);
  if (card) card.remove();
  if (!document.getElementById('builderOutput').querySelector('.built-chart-card')) {
    document.getElementById('builderOutput').innerHTML = '<div class="empty-builder"><div class="empty-icon">🎨</div><div>选择数据和图表类型，点击生成图表</div></div>';
  }
}

// ── Generate Report ──
function generateReport() {
  const myrRows = allData.filter(r => r.currency === 'MYR');
  const sgdRows = allData.filter(r => r.currency === 'SGD');
  const myrPromos = groupByPromo(myrRows, 'MYR');
  const sgdPromos = groupByPromo(sgdRows, 'SGD');

  function calcTotals(rows) {
    const bonus = rows.reduce((s,r) => s+r.bonus, 0);
    const wl    = rows.reduce((s,r) => s+r.winloss, 0);
    const np    = -wl - bonus;
    return { claims:rows.length, depPpl:rows.filter(r=>r.transfer>0).length, deposit:rows.reduce((s,r)=>s+r.transfer,0), bonus, winloss:wl, netProfit:np, roi:bonus>0?np/bonus*100:null };
  }

  const myrT = calcTotals(myrRows);
  const sgdT = calcTotals(sgdRows);
  const dates = allData.map(r => r.date).sort();
  const monthStr = dates.length > 0 ? new Date(dates[0]).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) : new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'});

  function fmtK(n, cur) {
    if (!n && n !== 0) return (cur==='SGD'?'S$':'RM')+'0.00';
    const sym = cur === 'SGD' ? 'S$' : 'RM';
    const abs = Math.abs(n);
    const s = sym + abs.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
    return n < 0 ? '('+s+')' : s;
  }

  function getStatus(p) {
    if (p.netProfit > 0) return 'CONTINUE';
    if (p.netProfit < 0 && p.depPpl > 0) return 'REVIEW';
    return 'STOP';
  }

  function kpiCards(t, cur) {
    const np = t.netProfit||0;
    const npC = np>=0?'#059669':'#DC2626';
    const roiStr = t.roi!=null?(t.roi>=0?'+':'')+t.roi.toFixed(1)+'%':'—';
    const depRate = t.claims>0?Math.round(t.depPpl/t.claims*100):0;
    return `<div class="kpi-grid">
      <div class="kpi-card blue"><div class="kpi-icon">🎫</div><div class="kpi-val">${t.claims.toLocaleString()}</div><div class="kpi-label">Total Claims</div><div class="kpi-sub">promo redemptions</div></div>
      <div class="kpi-card teal"><div class="kpi-icon">👤</div><div class="kpi-val">${t.depPpl.toLocaleString()}</div><div class="kpi-label">Depositors</div><div class="kpi-sub">${depRate}% of claimants</div></div>
      <div class="kpi-card green"><div class="kpi-icon">💰</div><div class="kpi-val">${fmtK(t.deposit,cur)}</div><div class="kpi-label">Total Deposits</div><div class="kpi-sub">generated</div></div>
      <div class="kpi-card amber"><div class="kpi-icon">🎁</div><div class="kpi-val">${fmtK(t.bonus,cur)}</div><div class="kpi-label">Bonus Paid Out</div><div class="kpi-sub">total cost</div></div>
      <div class="kpi-card" style="border-top:4px solid ${npC}"><div class="kpi-icon">${np>=0?'📈':'📉'}</div><div class="kpi-val" style="color:${npC}">${np>=0?'+':''}${fmtK(np,cur)}</div><div class="kpi-label">Net Profit</div><div class="kpi-sub">ROI: ${roiStr}</div></div>
    </div>`;
  }

  function promoTable(promos, cur) {
    return `<div class="section"><div class="section-header">Promo Performance (${cur})</div>
      <table><thead><tr>
        <th>Promo Name</th><th>Claims</th><th>Dep.</th><th>Total Deposit</th><th>Bonus</th><th>Win/Loss</th><th>Net Profit</th><th>ROI</th><th>Dep%</th><th>Status</th>
      </tr></thead><tbody>
        ${promos.map((p,i)=>{
          const s=getStatus(p);
          const sC=s==='CONTINUE'?'#059669':'#D97706';
          const sBg=s==='CONTINUE'?'#D1FAE5':'#FEF3C7';
          const npC=p.netProfit>0?'#059669':p.netProfit<0?'#DC2626':'#64748B';
          const dr=p.claims>0?Math.round(p.depPpl/p.claims*100):0;
          return `<tr style="background:${i%2===0?'white':'#F8FAFC'}">
            <td>${p.name}</td>
            <td style="text-align:center;color:#1A6BB5;font-weight:bold">${p.claims}</td>
            <td style="text-align:center;color:#028090">${p.depPpl}</td>
            <td style="text-align:right;color:#059669">${fmtK(p.deposit,cur)}</td>
            <td style="text-align:right;color:#D97706">${fmtK(p.bonus,cur)}</td>
            <td style="text-align:right;color:#64748B">${fmtK(p.winloss,cur)}</td>
            <td style="text-align:right;color:${npC};font-weight:bold">${p.netProfit>=0?'+':''}${fmtK(p.netProfit,cur)}</td>
            <td style="text-align:center;color:${npC};font-weight:bold">${p.roi!=null?(p.roi>=0?'+':'')+p.roi.toFixed(1)+'%':'—'}</td>
            <td style="text-align:center;color:${dr>=50?'#059669':'#DC2626'};font-weight:bold">${dr}%</td>
            <td style="background:${sBg};color:${sC};font-weight:bold;text-align:center">${s}</td>
          </tr>`;
        }).join('')}
      </tbody></table></div>`;
  }

  function recSection(promos, cur) {
    const cont = promos.filter(p=>getStatus(p)==='CONTINUE');
    const rev  = promos.filter(p=>getStatus(p)==='REVIEW');
    return `<div class="section"><div class="section-header">Recommendations (${cur})</div>
      <div class="rec-grid">
        <div class="rec-box green-box"><div class="rec-title">✅ Continue</div><div class="rec-sub">High engagement & good conversion</div>
          ${cont.map(p=>`<div class="rec-item"><b>${p.name}</b><br><span>Claims: ${p.claims} | NP: ${p.netProfit>=0?'+':''}${fmtK(p.netProfit,cur)} | ROI: ${p.roi!=null?(p.roi>=0?'+':'')+p.roi.toFixed(1)+'%':'—'}</span></div>`).join('')}
        </div>
        <div class="rec-box amber-box"><div class="rec-title">⚠️ Review</div><div class="rec-sub">Low profit — review conditions</div>
          ${rev.map(p=>`<div class="rec-item"><b>${p.name}</b><br><span>Claims: ${p.claims} | NP: ${fmtK(p.netProfit,cur)} | ROI: ${p.roi!=null?p.roi.toFixed(1)+'%':'—'}</span></div>`).join('')}
        </div>
      </div></div>`;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<title>PROMO Report ${monthStr}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script>
<style>
  @media print{.no-print{display:none!important}body{margin:0}.section{page-break-inside:avoid}.charts-section{page-break-before:always}}
  body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#1e293b;}
  .cover{background:#0F3460;color:white;padding:80px 60px;min-height:380px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;}
  .cover::after{content:'';position:absolute;top:-60px;right:-60px;width:300px;height:300px;background:rgba(0,212,170,0.15);border-radius:50%;}
  .cover h1{font-size:60px;font-weight:900;margin:0 0 8px;color:white;position:relative;z-index:1;}
  .cover h2{font-size:28px;color:#00D4AA;margin:0 0 24px;position:relative;z-index:1;}
  .cover .meta{font-size:14px;color:#8899AA;position:relative;z-index:1;}

  .green-box .rec-title{color:#059669;} .amber-box .rec-title{color:#D97706;}
  .rec-sub{font-size:10px;font-style:italic;margin-bottom:10px;}
  .green-box .rec-sub{color:#059669;} .amber-box .rec-sub{color:#D97706;}

<button class="print-btn no-print" onclick="window.print()">🖨️ 打印 / 另存 PDF</button>
<div class="cover">

</div>
${myrRows.length?`
<div class="divider"></div>

${promoTable(myrPromos,'MYR')}

${recSection(sgdPromos,'SGD')}

<script>
function mkCharts(promos, prefix, fmtFn) {
  const top8 = promos.slice(0,8);
  const labels = top8.map(p=>p.name.length>18?p.name.slice(0,18)+'…':p.name);
  const C = ['#1A6BB5','#028090','#059669','#D97706','#7C3AED','#DB2777','#EA580C','#0891B2'];
  const opts = {responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{font:{size:9},color:'#64748B'},grid:{display:false}},y:{ticks:{font:{size:9},color:'#64748B'},grid:{color:'#E2E8F0'}}}};
  new Chart(document.getElementById(prefix+'C1'),{type:'bar',data:{labels,datasets:[{data:top8.map(p=>p.claims),backgroundColor:C,borderRadius:3}]},options:{...opts,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'Claims: '+c.parsed.y}}}}});
  new Chart(document.getElementById(prefix+'C2'),{type:'bar',data:{labels,datasets:[{label:'Deposit',data:top8.map(p=>p.deposit),backgroundColor:'#1A6BB5',borderRadius:2},{label:'Bonus',data:top8.map(p=>p.bonus),backgroundColor:'#D97706',borderRadius:2}]},options:{...opts,plugins:{legend:{position:'bottom',labels:{font:{size:9}}},tooltip:{mode:'index',intersect:false,callbacks:{label:c=>c.dataset.label+': '+fmtFn(c.parsed.y)}}},scales:{x:{ticks:{font:{size:9},color:'#64748B'},grid:{display:false}},y:{ticks:{font:{size:9},color:'#64748B',callback:v=>fmtFn(v)},grid:{color:'#E2E8F0'}}}}});
  const sortedNP = [...promos].sort((a,b)=>b.netProfit-a.netProfit).slice(0,8);
  new Chart(document.getElementById(prefix+'C3'),{type:'bar',data:{labels:sortedNP.map(p=>p.name.length>18?p.name.slice(0,18)+'…':p.name),datasets:[{data:sortedNP.map(p=>p.netProfit),backgroundColor:sortedNP.map(p=>p.netProfit>=0?'#059669':'#DC2626'),borderRadius:3}]},options:{...opts,indexAxis:'y',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'NP: '+fmtFn(c.parsed.x)}}},scales:{x:{ticks:{font:{size:9},color:'#64748B',callback:v=>fmtFn(v)},grid:{color:'#E2E8F0'}},y:{ticks:{font:{size:9},color:'#64748B'},grid:{display:false}}}}});
  new Chart(document.getElementById(prefix+'C4'),{type:'pie',data:{labels:top8.map(p=>p.name.length>16?p.name.slice(0,16)+'…':p.name),datasets:[{data:top8.map(p=>p.bonus),backgroundColor:C,borderWidth:1,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:8},boxWidth:10}},tooltip:{callbacks:{label:c=>c.label+': '+fmtFn(c.parsed)}}}}});
}
${myrPromos.length?`mkCharts(${JSON.stringify(myrPromos.slice(0,8))},'myr',n=>{const abs=Math.abs(n);const s='RM'+abs.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?'('+s+')':s;});`:''}
${sgdPromos.length?`mkCharts(${JSON.stringify(sgdPromos.slice(0,8))},'sgd',n=>{const abs=Math.abs(n);const s='S$'+abs.toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});return n<0?'('+s+')':s;});`:''}
<\/script>
</body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `PROMO_Report_${monthStr.replace(' ','_')}.html`;
  a.click();
  URL.revokeObjectURL(url);
  setTimeout(() => alert('✅ 报告已下载！\n打开 HTML 文件后点右下角「打印」→「另存为 PDF」'), 500);
}

// Start
init();
</script>
