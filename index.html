<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROMO Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080B0F;
  --surface: #0E1318;
  --surface2: #141B22;
  --surface3: #1A2330;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --text: #E2EAF0;
  --muted: #5A6A78;
  --muted2: #8A9BAA;
  --green: #00E5A0;
  --green-dim: rgba(0,229,160,0.12);
  --red: #FF3D5A;
  --red-dim: rgba(255,61,90,0.12);
  --amber: #FFB020;
  --amber-dim: rgba(255,176,32,0.12);
  --blue: #4D9FFF;
  --blue-dim: rgba(77,159,255,0.12);
  --purple: #A78BFA;
  --purple-dim: rgba(167,139,250,0.12);
  --font: 'Syne', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-x: hidden; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(77,159,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(77,159,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

.app { position: relative; z-index: 1; max-width: 1600px; margin: 0 auto; padding: 2.5rem 2.5rem; }

.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo-mark { width: 52px; height: 52px; background: linear-gradient(135deg, #4D9FFF, #00E5A0); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #080B0F; flex-shrink: 0; }
.logo h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.logo h1 span { color: var(--blue); }
.logo p { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); margin-top: 3px; }

.status-chip { display: flex; align-items: center; gap: 7px; padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; font-size: 0.75rem; font-family: var(--mono); color: var(--muted2); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

.loading-zone { border: 1.5px dashed var(--border2); border-radius: 16px; padding: 3rem 2rem; text-align: center; margin-bottom: 2rem; background: var(--surface); }
.loading-zone .icon { font-size: 2.5rem; margin-bottom: 1rem; }
.loading-zone h3 { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; }
.loading-zone p { font-size: 0.82rem; color: var(--muted2); font-family: var(--mono); }

.controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
.tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
.tab { padding: 7px 20px; border-radius: 7px; font-size: 0.82rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--muted2); transition: all 0.15s; }
.tab.active { background: var(--blue); color: #080B0F; }

.filter-wrap { display: flex; gap: 8px; }
.promo-filter { font-size: 0.8rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-family: var(--mono); cursor: pointer; min-width: 160px; }

.metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.4rem 1.4rem; position: relative; overflow: hidden; }
.metric::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--blue); opacity: 0.4; }
.metric.hi::after { background: var(--green); opacity: 1; }
.metric.lo::after { background: var(--red); opacity: 1; }
.metric .lbl { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.metric .val { font-size: 1.8rem; font-weight: 700; font-family: var(--mono); letter-spacing: -0.02em; line-height: 1; }
.metric .val.hi { color: var(--green); }
.metric .val.lo { color: var(--red); }
.metric .val.amber { color: var(--amber); }
.metric .sub { font-size: 0.68rem; color: var(--muted); margin-top: 5px; font-family: var(--mono); }
.metric .sub.hi { color: var(--green); }
.metric .sub.lo { color: var(--red); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
.chart-card.wide { grid-column: 1 / -1; }
.chart-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.chart-title { font-size: 0.72rem; font-family: var(--mono); color: var(--muted2); text-transform: uppercase; letter-spacing: 0.08em; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; }
.legend span { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--muted2); font-family: var(--mono); }
.leg { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.chart-wrap { position: relative; width: 100%; height: 260px; }
.chart-wrap.tall { height: 280px; }

.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
.table-hd { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
.table-title { font-size: 0.72rem; font-family: var(--mono); color: var(--muted2); text-transform: uppercase; letter-spacing: 0.08em; }
.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }
th { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); font-weight: 400; text-align: right; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; letter-spacing: 0.05em; text-transform: uppercase; }
th:first-child, th:nth-child(2), th:nth-child(3) { text-align: left; }
td { padding: 13px 16px; border-bottom: 1px solid var(--border); text-align: right; font-family: var(--mono); font-size: 0.95rem; white-space: nowrap; color: var(--muted2); }
td:first-child { text-align: left; color: var(--muted); font-size: 0.75rem; }
td:nth-child(2), td:nth-child(3) { text-align: left; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; font-family: var(--mono); }
.pill.hi { background: var(--green-dim); color: var(--green); }
.pill.lo { background: var(--red-dim); color: var(--red); }
.pill.mid { background: var(--amber-dim); color: var(--amber); }
.pill.neu { background: var(--surface3); color: var(--muted); }

.type-tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-family: var(--mono); background: var(--blue-dim); color: var(--blue); }

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">
      <div class="logo-mark">P</div>
      <div>
        <h1>PROMO <span>Dashboard</span></h1>
        <p>存款行为分析  |  MYR</p>
      </div>
    </div>
    <div class="status-chip">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">加载中...</span>
    </div>
  </div>

  <div class="loading-zone" id="loadingZone">
    <div class="icon" id="loadingIcon">⏳</div>
    <h3 id="loadingTitle">正在读取数据...</h3>
    <p id="loadingDesc">从 Google Sheets 加载最新数据</p>
  </div>

  <div id="dashboard" class="hidden">
    <div class="controls">
      <div class="tabs">
        <button class="tab active" onclick="setView('day',this)">日</button>
        <button class="tab" onclick="setView('week',this)">周</button>
        <button class="tab" onclick="setView('month',this)">月</button>
      </div>
      <div class="filter-wrap">
        <select class="promo-filter" id="typeFilter" onchange="render()">
          <option value="all">全部类型</option>
        </select>
        <select class="promo-filter" id="nameFilter" onchange="render()">
          <option value="all">全部 Promo</option>
        </select>
      </div>
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="lbl">领取人数</div>
        <div class="val" id="mClaims">—</div>
        <div class="sub" id="mClaimsSub">—</div>
      </div>
      <div class="metric">
        <div class="lbl">存款人数</div>
        <div class="val" id="mDepPpl">—</div>
        <div class="sub" id="mDepPplSub">—</div>
      </div>
      <div class="metric">
        <div class="lbl">存款转化率</div>
        <div class="val" id="mConv">—</div>
        <div class="sub" id="mConvSub">—</div>
      </div>
      <div class="metric">
        <div class="lbl">总存款金额</div>
        <div class="val" id="mDeposit">—</div>
        <div class="sub" id="mDepositSub">—</div>
      </div>
      <div class="metric">
        <div class="lbl">派发 Bonus</div>
        <div class="val" id="mBonus">—</div>
        <div class="sub" id="mBonusSub">—</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-hd"><div class="chart-title">领取人数趋势</div></div>
        <div class="chart-wrap tall"><canvas id="claimChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-hd"><div class="chart-title">存款转化率趋势</div></div>
        <div class="chart-wrap tall"><canvas id="convChart"></canvas></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-hd">
          <div class="chart-title">存款金额 vs 派发 Bonus</div>
          <div class="legend">
            <span><span class="leg" style="background:var(--blue)"></span>存款金额</span>
            <span><span class="leg" style="background:var(--amber)"></span>派发Bonus</span>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="depBonusChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-hd"><div class="chart-title">人均存款趋势</div></div>
        <div class="chart-wrap"><canvas id="ppaChart"></canvas></div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-hd">
        <div class="table-title" id="tableTitle">明细数据</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>Promo 类型</th>
              <th>Promo 名称</th>
              <th>领取人数</th>
              <th>存款人数</th>
              <th>存款转化率</th>
              <th>存款金额</th>
              <th>派发 Bonus</th>
              <th>人均存款</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
let rawData = [];
let view = 'day';
let charts = {};

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWoz9XBMdoHrV6B4QKVAoGX58F_1YJx2Bzb6xbWNkWBveGpgk3Gi_Vb6nVYhLnrw/pub?output=csv';

async function loadData() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    parseCSV(text);
  } catch (err) {
    document.getElementById('loadingIcon').textContent = '❌';
    document.getElementById('loadingTitle').textContent = '读取失败';
    document.getElementById('loadingDesc').textContent = '请确认 Google Sheets 已发布成 CSV，或检查网络连接。';
    document.getElementById('statusText').textContent = '读取失败';
    console.error(err);
  }
}

window.addEventListener('DOMContentLoaded', loadData);

function cleanNum(s) {
  if (!s && s !== 0) return 0;
  let str = String(s).replace(/RM/gi,'').replace(/\s/g,'').replace(/"/g,'').trim();
  const neg = str.startsWith('(') && str.endsWith(')');
  str = str.replace(/[()]/g,'').replace(/,/g,'');
  const n = parseFloat(str) || 0;
  return neg ? -n : n;
}

function parseCSV(text) {
  const lines = [];
  text.trim().split('\n').forEach(line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cols.push(cur.trim());
    lines.push(cols);
  });

  let hRow = -1;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].some(c => c.includes('日期')) && lines[i].some(c => c.includes('领取'))) {
      hRow = i; break;
    }
  }

  if (hRow < 0) {
    document.getElementById('loadingIcon').textContent = '📭';
    document.getElementById('loadingTitle').textContent = '找不到表头';
    document.getElementById('loadingDesc').textContent = '请确认 Google Sheets 有包含「日期」和「领取人数」的表头行。';
    return;
  }

  rawData = [];
  for (let i = hRow + 1; i < lines.length; i++) {
    const r = lines[i];
    if (!r || !r[0] || r[0] === '合计' || r[0].trim() === '') continue;

    const claims  = cleanNum(r[3]);
    const depPpl  = cleanNum(r[4]);
    const deposit = cleanNum(r[5]);
    const bonus   = cleanNum(r[6]);

    if (claims === 0 && depPpl === 0 && deposit === 0 && bonus === 0) continue;

    const conv = claims > 0 ? depPpl / claims : 0;
    const ppa  = depPpl > 0 ? deposit / depPpl : 0;

    rawData.push({
      date:    r[0].trim(),
      type:    String(r[1] || '').trim(),
      name:    String(r[2] || '').trim(),
      claims, depPpl, deposit, bonus, conv, ppa
    });
  }

  if (!rawData.length) {
    document.getElementById('loadingIcon').textContent = '📭';
    document.getElementById('loadingTitle').textContent = '暂无数据';
    document.getElementById('loadingDesc').textContent = '请先在 Google Sheets 填入数据。';
    return;
  }

  document.getElementById('statusDot').classList.add('live');
  document.getElementById('statusText').textContent = '已同步 · ' + new Date().toLocaleTimeString('zh-MY');
  document.getElementById('loadingZone').style.display = 'none';
  document.getElementById('dashboard').classList.remove('hidden');

  // Populate filters
  const types = [...new Set(rawData.map(r => r.type).filter(Boolean))];
  const names = [...new Set(rawData.map(r => r.name).filter(Boolean))];

  const tf = document.getElementById('typeFilter');
  tf.innerHTML = '<option value="all">全部类型</option>' + types.map(t => `<option value="${t}">${t}</option>`).join('');

  const nf = document.getElementById('nameFilter');
  nf.innerHTML = '<option value="all">全部 Promo</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');

  render();
}

function setView(v, btn) {
  view = v;
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function getFiltered() {
  const type = document.getElementById('typeFilter').value;
  const name = document.getElementById('nameFilter').value;
  return rawData.filter(r =>
    (type === 'all' || r.type === type) &&
    (name === 'all' || r.name === name)
  );
}

function groupBy(data) {
  const map = {};
  data.forEach(r => {
    let key;
    if (view === 'day') { key = r.date; }
    else if (view === 'week') {
      const d = new Date(r.date);
      if (isNaN(d)) { key = r.date; }
      else {
        const jan1 = new Date(d.getFullYear(), 0, 1);
        const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
        key = `${d.getFullYear()}-W${String(week).padStart(2,'0')}`;
      }
    } else { key = r.date.slice(0, 7); }

    if (!map[key]) map[key] = { label:key, claims:0, depPpl:0, deposit:0, bonus:0 };
    map[key].claims  += r.claims;
    map[key].depPpl  += r.depPpl;
    map[key].deposit += r.deposit;
    map[key].bonus   += r.bonus;
  });

  return Object.values(map).sort((a,b) => a.label.localeCompare(b.label)).map(r => ({
    ...r,
    conv: r.claims > 0 ? r.depPpl / r.claims : 0,
    ppa:  r.depPpl > 0 ? r.deposit / r.depPpl : 0,
  }));
}

function fmtRM(n) {
  if (n === null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  const s = abs >= 1000000 ? 'RM'+(abs/1000000).toFixed(2)+'M' : abs >= 1000 ? 'RM'+(abs/1000).toFixed(1)+'k' : 'RM'+abs.toFixed(2);
  return n < 0 ? '('+s+')' : s;
}
function fmtN(n) { if (!n) return '—'; return n >= 1000 ? (n/1000).toFixed(1)+'k' : String(Math.round(n)); }
function fmtPct(n) { return (n*100).toFixed(1)+'%'; }

function convClass(n) { return n >= 0.5 ? 'hi' : n >= 0.3 ? 'mid' : n > 0 ? 'lo' : 'neu'; }
function convPill(n) { const cls = convClass(n); return `<span class="pill ${cls}">${fmtPct(n)}</span>`; }

function render() {
  const filtered = getFiltered();
  const grouped  = groupBy(filtered);

  const tClaims  = filtered.reduce((s,r) => s + r.claims,  0);
  const tDepPpl  = filtered.reduce((s,r) => s + r.depPpl,  0);
  const tDeposit = filtered.reduce((s,r) => s + r.deposit, 0);
  const tBonus   = filtered.reduce((s,r) => s + r.bonus,   0);
  const tConv    = tClaims > 0 ? tDepPpl / tClaims : 0;
  const tPPA     = tDepPpl > 0 ? tDeposit / tDepPpl : 0;

  // Metrics
  setVal('mClaims',  fmtN(tClaims),   filtered.length + ' 条记录', null);
  setVal('mDepPpl',  fmtN(tDepPpl),   tClaims > 0 ? '领取中有存款' : '—', null);
  setVal('mDeposit', fmtRM(tDeposit), '人均 ' + fmtRM(tPPA), null);
  setVal('mBonus',   fmtRM(tBonus),   '总成本', null);

  const convEl = document.getElementById('mConv');
  const convSub = document.getElementById('mConvSub');
  convEl.textContent = fmtPct(tConv);
  convEl.className = 'val ' + (tConv >= 0.5 ? 'hi' : tConv >= 0.3 ? 'amber' : 'lo');
  convSub.textContent = tConv >= 0.5 ? '转化率高 ▲' : tConv >= 0.3 ? '转化率中等' : '转化率低 ▼';
  convSub.className = 'sub ' + (tConv >= 0.5 ? 'hi' : tConv >= 0.3 ? '' : 'lo');

  const titles = { day:'日报明细', week:'周报明细', month:'月报明细' };
  document.getElementById('tableTitle').textContent = titles[view];

  renderCharts(grouped);
  renderTable(filtered);
}

function setVal(id, display, sub, cls) {
  const el = document.getElementById(id);
  const subEl = document.getElementById(id+'Sub');
  if (el) { el.textContent = display; if (cls) el.className = 'val ' + cls; }
  if (subEl) subEl.textContent = sub || '';
}

function destroyChart(id) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } }

function renderCharts(grouped) {
  const labels  = grouped.map(r => r.label.length > 7 ? r.label.slice(5) : r.label);
  const claims  = grouped.map(r => r.claims);
  const convs   = grouped.map(r => r.conv * 100);
  const deps    = grouped.map(r => r.deposit);
  const bons    = grouped.map(r => r.bonus);
  const ppas    = grouped.map(r => r.ppa);

  const gridC = 'rgba(255,255,255,0.04)';
  const xTick = { font:{size:10,family:'JetBrains Mono'}, color:'#5A6A78', autoSkip:true, maxRotation:45 };

  destroyChart('claimChart');
  charts['claimChart'] = new Chart(document.getElementById('claimChart'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'领取人数', data:claims, backgroundColor:'rgba(77,159,255,0.7)', borderRadius:4 }]},
    options: mkOpts(gridC, xTick, v => fmtN(v))
  });

  destroyChart('convChart');
  charts['convChart'] = new Chart(document.getElementById('convChart'), {
    type:'line',
    data:{ labels, datasets:[{
      label:'转化率', data:convs,
      borderColor:'#00E5A0', backgroundColor:'rgba(0,229,160,0.08)',
      borderWidth:2, tension:0.35, fill:true, pointRadius:3, pointBackgroundColor:'#00E5A0'
    }]},
    options: mkOpts(gridC, xTick, v => v.toFixed(0)+'%', '%')
  });

  destroyChart('depBonusChart');
  charts['depBonusChart'] = new Chart(document.getElementById('depBonusChart'), {
    type:'bar',
    data:{ labels, datasets:[
      { label:'存款金额', data:deps, backgroundColor:'rgba(77,159,255,0.7)', borderRadius:3 },
      { label:'派发Bonus', data:bons, backgroundColor:'rgba(255,176,32,0.7)', borderRadius:3 },
    ]},
    options:{ ...mkOpts(gridC, xTick, v => fmtRM(v)),
      plugins:{ legend:{display:false}, tooltip:{mode:'index',intersect:false, callbacks:{label:ctx=>ctx.dataset.label+': '+fmtRM(ctx.parsed.y)}}}}
  });

  destroyChart('ppaChart');
  charts['ppaChart'] = new Chart(document.getElementById('ppaChart'), {
    type:'line',
    data:{ labels, datasets:[{
      label:'人均存款', data:ppas,
      borderColor:'#A78BFA', backgroundColor:'rgba(167,139,250,0.08)',
      borderWidth:2, tension:0.35, fill:true, pointRadius:3, pointBackgroundColor:'#A78BFA'
    }]},
    options: mkOpts(gridC, xTick, v => fmtRM(v))
  });
}

function mkOpts(gridC, xTick, yCb, suffix='') {
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => ctx.dataset.label+': '+(suffix ? ctx.parsed.y.toFixed(1)+suffix : fmtRM(ctx.parsed.y)) }}},
    scales:{
      x:{ ticks:xTick, grid:{display:false}, border:{color:'transparent'} },
      y:{ ticks:{ font:{size:10,family:'JetBrains Mono'}, color:'#5A6A78', callback:yCb }, grid:{color:gridC}, border:{color:'transparent'} }
    }
  };
}

function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--muted)">没有数据</td></tr>`;
    return;
  }
  const sorted = [...data].sort((a,b) => b.date.localeCompare(a.date));
  tbody.innerHTML = sorted.map(r => `<tr>
    <td>${r.date}</td>
    <td><span class="type-tag">${r.type || '—'}</span></td>
    <td>${r.name || '—'}</td>
    <td>${fmtN(r.claims)}</td>
    <td>${fmtN(r.depPpl)}</td>
    <td>${convPill(r.conv)}</td>
    <td>${fmtRM(r.deposit)}</td>
    <td>${fmtRM(r.bonus)}</td>
    <td>${fmtRM(r.ppa)}</td>
  </tr>`).join('');
}
</script>
</body>
</html>
